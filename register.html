<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — 13e Café</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --brand: #2c3e50;
      --accent: #4caf50;
      --accent-dark: #45a049;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f5f6fa;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: #222;
      line-height: 1.5;
      padding: 15px;
    }

    .page {
      max-width: 480px;
      margin: 40px auto;
      padding: 24px 20px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .page h1 {
      margin-top: 0;
      color: var(--brand);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .page > p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
      color: var(--brand);
      font-size: 0.9rem;
    }

    input[type="text"], input[type="email"], input[type="date"], input[type="tel"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95em;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="date"]:focus, input[type="tel"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(76,175,80,0.15);
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    .error {
      color: #c53030;
      font-size: 0.9rem;
      margin-top: 8px;
      padding: 10px;
      background: #fee2e2;
      border-radius: 6px;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .actions button {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      transition: background 0.2s, transform 0.1s;
    }
    .actions button:active { transform: scale(0.98); }

    .actions .primary {
      background: var(--accent);
      color: #fff;
    }
    .actions .primary:hover { background: var(--accent-dark); }
    .actions .primary:disabled { background: #a5d6a7; cursor: not-allowed; }

    .actions .secondary {
      background: #f3f4f6;
      color: #374151;
    }
    .actions .secondary:hover { background: #e5e7eb; }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .page { margin: 20px auto; padding: 18px 14px; }
      .page h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Create Member Account</h1>
    <p>Please fill all fields. We'll check your phone and email are not already registered.</p>

    <form id="registerForm" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" placeholder="081234567890" required />

      <label for="birthdate">Birthdate</label>
      <input id="birthdate" name="birthdate" type="date" required />

      <div id="formError" class="error" role="alert" aria-live="polite" style="display:none;"></div>

      <div class="actions">
        <button type="button" id="cancelBtn" class="secondary">Cancel</button>
        <button type="submit" id="registerBtn" class="primary">Register</button>
      </div>
    </form>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Register logic -->
  <script src="register.js"></script>
</body>
</html>
